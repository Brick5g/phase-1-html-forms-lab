<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>My Awesome Company Contact Page</title>
  </head>
  <body>

    <h1>Company Inc.</h1>
    <h2>For all your incorporated company needs</h2>

      <form action="http.www.My-Awesome-Company-Contact-Page">

        <label for="fullname">fullname (required)</label>
        <input id="fullname" name="Enter Name" type="text" required placeholder="Enter Name">

        <label for="email">email (required)</label>
        <input id="email" name="Enter Email" type="email" required placeholder="Enter Email">

        <label for="phone"></label>
        <input id="phone" type="tel" name="phone" placeholder="Enter Telephone (optional)">

        <label for="message"></label>
        <textarea id="message" name="message" placeholder="Enter Message"></textarea>

        <h3>Why is Julian goated?</h3>
          
          <div class="checkbox-group">
            <input type="checkbox" name="option-1" id="checkbox" value="personality" /> Personality <br />
          </div>  
          <div class="checkbox-group">
            <input type="checkbox" name="option-2" id="checkbox" value="swag" /> Swag <br />
          </div>  
          <div class="checkbox-group">
            <input type="checkbox" name="option-3" id="checkbox" value="handsome" /> Handsome <br />
          </div>  
          <div class="checkbox-group">
            <input type="checkbox" name="option-4" id="checkbox" value="music taste" /> Music Taste <br />
          </div>  
          <div class="checkbox-group">
            <input type="checkbox" name="option-5" id="checkbox" value="all of the above" /> All of the Above <br />
          </div>
          
          <input type="submit" value="Submit to Coding greatness">

      </form>
          
  </body>
</html>
